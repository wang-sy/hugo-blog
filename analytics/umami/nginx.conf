limit_req_zone $binary_remote_addr zone=umami_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=umami_collect:10m rate=5r/s;
server {
    listen 80;
    server_name stats.wangsaiyu.com;
    client_max_body_size 64k;
    # Access logs are disabled: no long-lived visitor IP or referrer log.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = / {
        return 302 /share/oC3FXSxNS57MtR41?locale=zh-CN&date=30day;
    }
    location = /public/articles.json {
        alias /var/www/umami-public/articles.json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=60";
        add_header X-Content-Type-Options nosniff;
    }
    location = /api/auth/login {
        limit_req zone=umami_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/umami-proxy.conf;
    }
    location = /api/send {
        limit_req zone=umami_collect burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/umami-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/umami-proxy.conf;
    }
}
