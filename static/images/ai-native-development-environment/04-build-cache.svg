<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">构建缓存和制品复用</title><desc id="desc">同一构建器保留依赖与编译缓存，远端保存可导出的构建层，生成的不可变制品用于后续环境。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs>
<style>text{font-family:Arial,Helvetica,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020} .edge{fill:none;stroke:#222;stroke-width:1.6;stroke-linejoin:round} .node{stroke-width:1.6} </style>
<rect width="1000" height="510" fill="white"/>
<rect x="50" y="225" width="570" height="218" fill="#f5f5f5" stroke="#666666" stroke-width="1.6"/>
<text x="335" y="262" font-size="22" text-anchor="middle" font-weight="600">Runner 上的持久 BuildKit 构建器</text>
<path d="M 170 140 V 225" class="edge" marker-end="url(#arrow)"/>
<path d="M 500 140 V 225" class="edge" marker-end="url(#arrow)"/>
<text x="190" y="187" font-size="19" text-anchor="start" font-weight="400">写入缓存</text>
<text x="480" y="187" font-size="19" text-anchor="end" font-weight="400">读取、更新缓存</text>
<path d="M 620 312 H 740" class="edge" marker-end="url(#arrow)"/>
<path d="M 740 345 H 620" class="edge" marker-end="url(#arrow)"/>
<text x="680" y="293" font-size="18" text-anchor="middle" font-weight="400">导出 / 恢复</text>
<path d="M 620 95 H 975 V 412 H 950" class="edge" marker-end="url(#arrow)"/>
<text x="845" y="77" font-size="20" text-anchor="middle" font-weight="400">生成制品</text>
<g data-node="true">
<rect x="50" y="50" width="240" height="90" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="170.0" y="88.0" font-size="22" text-anchor="middle" font-weight="600">上一次构建</text>
<text x="170.0" y="119.0" font-size="19" text-anchor="middle" font-weight="400">使用当次准确源码</text>
</g>
<g data-node="true">
<rect x="380" y="50" width="240" height="90" fill="#b0e3e6" stroke="#0e8088" stroke-width="1.6"/>
<text x="500.0" y="88.0" font-size="22" text-anchor="middle" font-weight="600">本次构建</text>
<text x="500.0" y="119.0" font-size="19" text-anchor="middle" font-weight="400">清理旧源码与输出</text>
</g>
<g data-node="true">
<rect x="75" y="307" width="160" height="86" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="155.0" y="343.0" font-size="21" text-anchor="middle" font-weight="600">Go 模块</text>
<text x="155.0" y="374.0" font-size="19" text-anchor="middle" font-weight="400">下载缓存</text>
</g>
<g data-node="true">
<rect x="255" y="307" width="160" height="86" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="335.0" y="343.0" font-size="21" text-anchor="middle" font-weight="600">Go 编译</text>
<text x="335.0" y="374.0" font-size="19" text-anchor="middle" font-weight="400">编译缓存</text>
</g>
<g data-node="true">
<rect x="435" y="307" width="160" height="86" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="515.0" y="343.0" font-size="21" text-anchor="middle" font-weight="600">Node 依赖</text>
<text x="515.0" y="374.0" font-size="19" text-anchor="middle" font-weight="400">包下载缓存</text>
</g>
<g data-node="true">
<rect x="740" y="265" width="210" height="95" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="845.0" y="305.5" font-size="22" text-anchor="middle" font-weight="600">镜像仓库缓存</text>
<text x="845.0" y="336.5" font-size="19" text-anchor="middle" font-weight="400">可导出的构建层</text>
</g>
<g data-node="true">
<rect x="740" y="370" width="210" height="85" fill="#d5e8d4" stroke="#82b366" stroke-width="1.6"/>
<text x="845.0" y="405.5" font-size="22" text-anchor="middle" font-weight="600">不可变制品</text>
<text x="845.0" y="436.5" font-size="19" text-anchor="middle" font-weight="400">进入后续环境</text>
</g>
<text x="500" y="488" font-size="20" text-anchor="middle" font-weight="400">更换构建器后，本机缓存仍可能需要重新积累</text>
</svg>
