<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title" font-family="Arial,Helvetica,PingFang SC,Microsoft YaHei,sans-serif">
<title id="title">不同层的统计对象</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 L3 5Z" fill="#000"/></marker></defs>
<rect width="1000" height="330" fill="#fff"/>
<rect x="20" y="25" width="225" height="235" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
<text x="132.5" y="53" text-anchor="middle" font-size="22" font-weight="600" fill="#000">HTTP</text>
<path d="M20 67 H245" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>
<text x="132.5" y="137.0333333333333" text-anchor="middle" font-size="19" font-weight="400" fill="#000">request_id</text>
<text x="132.5" y="201.36666666666665" text-anchor="middle" font-size="19" font-weight="400" fill="#000">接收 / 响应状态</text>
<rect x="265" y="25" width="225" height="235" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
<text x="377.5" y="53" text-anchor="middle" font-size="22" font-weight="600" fill="#000">RPC</text>
<path d="M265 67 H490" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>
<text x="377.5" y="137.0333333333333" text-anchor="middle" font-size="19" font-weight="400" fill="#000">call_id</text>
<text x="377.5" y="201.36666666666665" text-anchor="middle" font-size="19" font-weight="400" fill="#000">耗时 / 错误 / 重试</text>
<rect x="510" y="25" width="225" height="235" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
<text x="622.5" y="53" text-anchor="middle" font-size="22" font-weight="600" fill="#000">Queue</text>
<path d="M510 67 H735" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>
<text x="622.5" y="137.0333333333333" text-anchor="middle" font-size="19" font-weight="400" fill="#000">message_id</text>
<text x="622.5" y="201.36666666666665" text-anchor="middle" font-size="19" font-weight="400" fill="#000">积压 / 等待时间</text>
<rect x="755" y="25" width="225" height="235" fill="#d5e8d4" stroke="#82b366" stroke-width="1.6"/>
<text x="867.5" y="53" text-anchor="middle" font-size="22" font-weight="600" fill="#000">Run</text>
<path d="M755 67 H980" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>
<text x="867.5" y="137.0333333333333" text-anchor="middle" font-size="19" font-weight="400" fill="#000">run_id</text>
<text x="867.5" y="201.36666666666665" text-anchor="middle" font-size="19" font-weight="400" fill="#000">终态 / 结束原因</text>
<text x="500" y="305" text-anchor="middle" font-size="22" font-weight="400" fill="#000">同一 Run 可以对应多次 RPC 调用和重试</text>
</svg>