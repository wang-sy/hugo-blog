<text x="164" y="59" fill="#6D7D75" font-size="17" font-weight="500" text-anchor="start" letter-spacing="2">ENGINEERING / FIELD NOTES</text>
<text x="48" y="119" fill="#233C35" font-size="40" font-weight="650" text-anchor="start" >从 NLB 到 RPC，入口分了几层</text>
<text x="50" y="159" fill="#6D7D75" font-size="23" font-weight="400" text-anchor="start" >Gateway 与 WAP 分别适配客户端，复用内部业务服务。</text>
<rect x="48" y="213" width="272" height="111" rx="14" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="184" y="255" fill="#233C35" font-size="29" font-weight="650" text-anchor="middle" >Web / 移动端</text>
<text x="184" y="296" fill="#6D7D75" font-size="20" font-weight="400" text-anchor="middle" >发起 HTTP / WebSocket</text>
<rect x="464" y="213" width="272" height="111" rx="14" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="600" y="255" fill="#233C35" font-size="29" font-weight="650" text-anchor="middle" >NLB</text>
<text x="600" y="296" fill="#6D7D75" font-size="20" font-weight="400" text-anchor="middle" >连接分发 · 后端健康检查</text>
<rect x="880" y="213" width="272" height="111" rx="14" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="1016" y="255" fill="#233C35" font-size="29" font-weight="650" text-anchor="middle" >Nginx</text>
<text x="1016" y="296" fill="#6D7D75" font-size="20" font-weight="400" text-anchor="middle" >HTTP 路由 · 连接代理</text>
<path d="M 332 267 H 452" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-15-arrow)" />
<path d="M 748 267 H 868" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-15-arrow)" />
<rect x="48" y="382" width="422" height="180" rx="16" fill="#E5EDE2" stroke="none" stroke-width="1"/>
<rect x="72" y="402" width="94" height="32" rx="8" fill="#316650" stroke="none" stroke-width="1"/>
