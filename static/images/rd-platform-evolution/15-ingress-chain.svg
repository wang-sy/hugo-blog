<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="rdfig-15-title rdfig-15-desc" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<title id="rdfig-15-title">从 NLB 到 RPC，入口分了几层</title>
<desc id="rdfig-15-desc">使用通用服务角色和示例编号说明具体机制，不包含内部资源标识。</desc>
<defs>
