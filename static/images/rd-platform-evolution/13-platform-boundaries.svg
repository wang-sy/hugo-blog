<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="rdfig-13-title rdfig-13-desc" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<title id="rdfig-13-title">进程可以收敛，数据归属仍然分开</title>
<desc id="rdfig-13-desc">使用通用服务角色和示例编号说明具体机制，不包含内部资源标识。</desc>
<defs>
<marker id="rdfig-13-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#316650" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="rdfig-13-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#B65D3D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="1060" rx="22" fill="#F7F7F2"/>
<rect x="48" y="36" width="94" height="32" rx="8" fill="#233C35" stroke="none" stroke-width="1"/>
<text x="95" y="58" fill="#DCEBB1" font-size="17" font-weight="600" text-anchor="middle" >FIG. 03</text>
<text x="164" y="59" fill="#6D7D75" font-size="17" font-weight="500" text-anchor="start" letter-spacing="2">ENGINEERING / FIELD NOTES</text>
<text x="48" y="119" fill="#233C35" font-size="40" font-weight="650" text-anchor="start" >进程可以收敛，数据归属仍然分开</text>
<text x="50" y="159" fill="#6D7D75" font-size="23" font-weight="400" text-anchor="start" >减少平台内部转发，保留请求处理、持久执行和模块写入边界。</text>
<rect x="48" y="212" width="116" height="32" rx="8" fill="#F5E5D9" stroke="none" stroke-width="1"/>
<text x="106" y="234" fill="#B65D3D" font-size="17" font-weight="600" text-anchor="middle" >拆分阶段</text>
<rect x="200" y="208" width="220" height="80" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="310" y="258" fill="#233C35" font-size="29" font-weight="650" text-anchor="middle" >Web</text>
<path d="M 432 248 H 530" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-13-arrow)" />
<rect x="542" y="208" width="220" height="80" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="652" y="258" fill="#233C35" font-size="29" font-weight="650" text-anchor="middle" >网关</text>
<path d="M 774 248 H 872" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-13-arrow)" />
<rect x="884" y="208" width="244" height="80" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="1006" y="258" fill="#233C35" font-size="29" font-weight="650" text-anchor="middle" >管理服务</text>
<text x="600" y="326" fill="#6D7D75" font-size="24" font-weight="400" text-anchor="middle" >跨进程调用，需要协调接口与部署版本</text>
<rect x="48" y="372" width="1104" height="584" rx="18" fill="#FFFFFF" stroke="#D7DED5" stroke-width="2"/>
<rect x="72" y="394" width="116" height="32" rx="8" fill="#316650" stroke="none" stroke-width="1"/>
<text x="130" y="416" fill="#FFFFFF" font-size="17" font-weight="600" text-anchor="middle" >收敛以后</text>
<text x="220" y="418" fill="#233C35" font-size="25" font-weight="600" text-anchor="start" >同一模块 · 同一镜像 · 共同发布</text>
<rect x="72" y="461" width="504" height="106" rx="12" fill="#E5EDE2" stroke="none" stroke-width="1"/>
<rect x="624" y="461" width="504" height="106" rx="12" fill="#E7EEF2" stroke="none" stroke-width="1"/>
<text x="96" y="501" fill="#233C35" font-size="29" font-weight="650" text-anchor="start" >HTTP 进程</text>
<text x="96" y="540" fill="#316650" font-size="23" font-weight="400" text-anchor="start" >页面 / API / 本地用例调用</text>
<text x="648" y="501" fill="#233C35" font-size="29" font-weight="650" text-anchor="start" >持久 Worker 进程</text>
<text x="648" y="540" fill="#45677F" font-size="23" font-weight="400" text-anchor="start" >发布 / 资源同步 / 通知投递</text>
<path d="M 324 579 V 614" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-13-arrow)" />
<path d="M 876 579 V 614" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-13-arrow)" />
<rect x="72" y="628" width="1056" height="149" rx="12" fill="#F7F7F2" stroke="none" stroke-width="1"/>
<text x="96" y="662" fill="#233C35" font-size="25" font-weight="600" text-anchor="start" >模块各自拥有写入权，跨模块通过契约协作</text>
<text x="96" y="711" fill="#233C35" font-size="26" font-weight="600" text-anchor="start" >服务目录</text>
<text x="96" y="748" fill="#6D7D75" font-size="20" font-weight="400" text-anchor="start" >注册 · 构建绑定</text>
<line x1="341" y1="686" x2="341" y2="754" stroke="#D7DED5" stroke-width="1" />
<text x="355" y="711" fill="#233C35" font-size="26" font-weight="600" text-anchor="start" >发布</text>
<text x="355" y="748" fill="#6D7D75" font-size="20" font-weight="400" text-anchor="start" >制品 · 目标 · 发布单</text>
<line x1="600" y1="686" x2="600" y2="754" stroke="#D7DED5" stroke-width="1" />
<text x="614" y="711" fill="#233C35" font-size="26" font-weight="600" text-anchor="start" >个人环境</text>
<text x="614" y="748" fill="#6D7D75" font-size="20" font-weight="400" text-anchor="start" >代次 · 回收状态</text>
<line x1="859" y1="686" x2="859" y2="754" stroke="#D7DED5" stroke-width="1" />
<text x="873" y="711" fill="#233C35" font-size="26" font-weight="600" text-anchor="start" >资源管理</text>
<text x="873" y="748" fill="#6D7D75" font-size="20" font-weight="400" text-anchor="start" >受管关系 · 观察记录</text>
<line x1="600" y1="783" x2="600" y2="807" stroke="#316650" stroke-width="2.5" />
<text x="600" y="836" fill="#316650" font-size="23" font-weight="600" text-anchor="middle" >端口接口 · 启动时显式组装</text>
<path d="M 399 827 H 324 V 862" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-13-arrow)" />
<path d="M 801 827 H 876 V 862" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-13-arrow)" />
<rect x="72" y="875" width="504" height="57" rx="10" fill="#E5EDE2" stroke="none" stroke-width="1"/>
<rect x="624" y="875" width="504" height="57" rx="10" fill="#E7EEF2" stroke="none" stroke-width="1"/>
<text x="324" y="912" fill="#233C35" font-size="24" font-weight="550" text-anchor="middle" >PostgreSQL · 按模块持有记录</text>
<text x="876" y="912" fill="#233C35" font-size="24" font-weight="550" text-anchor="middle" >集群 / 指标 / 日志适配器</text>
<line x1="48" y1="988" x2="1152" y2="988" stroke="#D7DED5" stroke-width="2" />
<circle cx="58" cy="1022" r="5" fill="#316650" stroke="none" stroke-width="1"/>
<text x="76" y="1030" fill="#233C35" font-size="23" font-weight="500" text-anchor="start" >进程资源可分别限制；共同发布与扩容带来的耦合仍然存在。</text>
</svg>
