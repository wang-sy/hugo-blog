<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="rdfig-12-title rdfig-12-desc" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<title id="rdfig-12-title">业务请求怎么走，发布指令怎么走</title>
<desc id="rdfig-12-desc">使用通用服务角色和示例编号说明具体机制，不包含内部资源标识。</desc>
<defs>
<marker id="rdfig-12-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#316650" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="rdfig-12-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#B65D3D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="1010" rx="22" fill="#F7F7F2"/>
<rect x="48" y="36" width="94" height="32" rx="8" fill="#233C35" stroke="none" stroke-width="1"/>
<text x="95" y="58" fill="#DCEBB1" font-size="17" font-weight="600" text-anchor="middle" >FIG. 04</text>
<text x="164" y="59" fill="#6D7D75" font-size="17" font-weight="500" text-anchor="start" letter-spacing="2">ENGINEERING / FIELD NOTES</text>
<text x="48" y="119" fill="#233C35" font-size="40" font-weight="650" text-anchor="start" >业务请求怎么走，发布指令怎么走</text>
<text x="50" y="159" fill="#6D7D75" font-size="23" font-weight="400" text-anchor="start" >应用服务承接用户请求；正式控制面负责更新这些服务。</text>
<rect x="48" y="207" width="1104" height="167" rx="18" fill="#E5EDE2" stroke="none" stroke-width="1"/>
<rect x="72" y="225" width="110" height="32" rx="8" fill="#316650" stroke="none" stroke-width="1"/>
<text x="127" y="247" fill="#FFFFFF" font-size="17" font-weight="600" text-anchor="middle" >业务请求</text>
<rect x="72" y="281" width="172" height="66" rx="10" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="158" y="323" fill="#233C35" font-size="27" font-weight="600" text-anchor="middle" >产品用户</text>
<path d="M 256 314 H 352" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-12-arrow)" />
