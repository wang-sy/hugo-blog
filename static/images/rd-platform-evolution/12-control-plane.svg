<text x="482" y="323" fill="#233C35" font-size="27" font-weight="600" text-anchor="middle" >业务入口</text>
<path d="M 612 314 H 780" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-12-arrow)" />
<text x="696" y="295" fill="#316650" font-size="21" font-weight="500" text-anchor="middle" >按环境路由</text>
<rect x="794" y="227" width="334" height="124" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="961" y="264" fill="#233C35" font-size="26" font-weight="650" text-anchor="middle" >调度 / 执行等应用服务</text>
<text x="961" y="305" fill="#316650" font-size="22" font-weight="400" text-anchor="middle" >个人 · 共享测试</text>
<text x="961" y="336" fill="#316650" font-size="22" font-weight="400" text-anchor="middle" >预发布 · 正式</text>
<rect x="48" y="417" width="1104" height="461" rx="18" fill="#FFFFFF" stroke="#D7DED5" stroke-width="2"/>
<rect x="72" y="439" width="145" height="32" rx="8" fill="#233C35" stroke="none" stroke-width="1"/>
<text x="144.5" y="461" fill="#DCEBB1" font-size="17" font-weight="600" text-anchor="middle" >正式控制面</text>
<text x="240" y="462" fill="#6D7D75" font-size="23" font-weight="400" text-anchor="start" >验证身份、保存操作、领取执行、核对结果</text>
<rect x="72" y="511" width="248" height="108" rx="12" fill="#E5EDE2" stroke="none" stroke-width="1"/>
<text x="96" y="550" fill="#233C35" font-size="28" font-weight="650" text-anchor="start" >页面 / CLI</text>
<text x="96" y="588" fill="#316650" font-size="22" font-weight="400" text-anchor="start" >校验人的身份与权限</text>
<rect x="72" y="666" width="248" height="108" rx="12" fill="#E7EEF2" stroke="none" stroke-width="1"/>
<text x="96" y="705" fill="#233C35" font-size="28" font-weight="650" text-anchor="start" >CI</text>
<text x="96" y="743" fill="#45677F" font-size="22" font-weight="400" text-anchor="start" >核对构建任务与来源</text>
<path d="M 332 565 H 376" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-12-arrow)" />
<path d="M 332 721 H 354 V 584 H 376" fill="none" stroke="#316650" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-12-arrow)" />
<rect x="388" y="511" width="220" height="263" rx="14" fill="#F7F7F2" stroke="none" stroke-width="1"/>
<text x="498" y="551" fill="#233C35" font-size="29" font-weight="650" text-anchor="middle" >平台 HTTP</text>
<line x1="412" y1="574" x2="584" y2="574" stroke="#D7DED5" stroke-width="2" />
<text x="498" y="618" fill="#233C35" font-size="23" font-weight="400" text-anchor="middle" >解析发布目标</text>
