<path d="M 670 582 A 85 20 0 0 1 840 582 L 840 706 A 85 20 0 0 1 670 706 Z" fill="#233C35"/>
<ellipse cx="755" cy="582" rx="85" ry="20" fill="#316650" stroke="#F7F7F2" stroke-width="2"/>
<path d="M 670 671 A 85 20 0 0 0 840 671" stroke="#789482" stroke-width="2" fill="none"/>
<text x="755" y="626" fill="#FFFFFF" font-size="23" font-weight="600" text-anchor="middle" >PostgreSQL</text>
<text x="755" y="665" fill="#DCEBB1" font-size="20" font-weight="500" text-anchor="middle" >发布单 / 租约</text>
<text x="755" y="758" fill="#6D7D75" font-size="20" font-weight="400" text-anchor="middle" >提交后可被领取</text>
<path d="M 852 642 H 893" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-12-arrow)" />
<rect x="906" y="511" width="222" height="263" rx="14" fill="#233C35" stroke="none" stroke-width="1"/>
<text x="1017" y="551" fill="#DCEBB1" font-size="28" font-weight="650" text-anchor="middle" >持久 Worker</text>
<line x1="930" y1="574" x2="1104" y2="574" stroke="#567061" stroke-width="2" />
<text x="1017" y="618" fill="#FFFFFF" font-size="23" font-weight="400" text-anchor="middle" >领取有效操作</text>
<text x="1017" y="657" fill="#FFFFFF" font-size="23" font-weight="400" text-anchor="middle" >更新目标实例</text>
<text x="1017" y="696" fill="#FFFFFF" font-size="23" font-weight="400" text-anchor="middle" >读取运行状态</text>
<text x="1017" y="735" fill="#FFFFFF" font-size="23" font-weight="400" text-anchor="middle" >保存执行进度</text>
<path d="M 1017 499 V 382 H 1061 V 361" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-12-arrow)" />
<text x="991" y="405" fill="#316650" font-size="21" font-weight="550" text-anchor="end" >更新与核验</text>
<line x1="72" y1="805" x2="1128" y2="805" stroke="#D7DED5" stroke-width="2" />
<text x="600" y="844" fill="#233C35" font-size="25" font-weight="500" text-anchor="middle" >目标环境决定更新哪里；平台运行角色决定谁能执行。</text>
<line x1="48" y1="938" x2="1152" y2="938" stroke="#D7DED5" stroke-width="2" />
<circle cx="58" cy="972" r="5" fill="#316650" stroke="none" stroke-width="1"/>
<text x="76" y="980" fill="#233C35" font-size="23" font-weight="500" text-anchor="start" >管理平台不转发产品请求；新的发布依赖控制面正常运行。</text>
</svg>
