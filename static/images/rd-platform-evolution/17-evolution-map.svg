<rect x="72" y="865" width="130" height="32" rx="8" fill="#E5EDE2" stroke="none" stroke-width="1"/>
<text x="137" y="887" fill="#316650" font-size="17" font-weight="600" text-anchor="middle" >继续分工</text>
<text x="230" y="891" fill="#233C35" font-size="27" font-weight="650" text-anchor="start" >领域网关与移动端，共用下游能力</text>
