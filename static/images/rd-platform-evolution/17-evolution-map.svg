<text x="570" y="655" fill="#316650" font-size="22" font-weight="400" text-anchor="middle" >排队 · 分发 · 协调</text>
<rect x="838" y="578" width="290" height="104" rx="12" fill="#E5EDE2" stroke="none" stroke-width="1"/>
<text x="983" y="618" fill="#233C35" font-size="28" font-weight="650" text-anchor="middle" >Runtime</text>
<text x="983" y="655" fill="#316650" font-size="22" font-weight="400" text-anchor="middle" >Agent 执行</text>
<path d="M 316 630 H 416" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-17-arrow)" />
<path d="M 724 630 H 824" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-17-arrow)" />
<path d="M 570 691 V 712" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-17-arrow)" />
<rect x="430" y="724" width="280" height="52" rx="10" fill="#E7EEF2" stroke="none" stroke-width="1"/>
<text x="570" y="758" fill="#45677F" font-size="24" font-weight="600" text-anchor="middle" >项目 / 版本状态</text>
<text x="748" y="754" fill="#6D7D75" font-size="23" font-weight="400" text-anchor="start" >环境要穿过 RPC 和队列</text>
