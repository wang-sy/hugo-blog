<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1290" viewBox="0 0 1200 1290" role="img" aria-labelledby="rdfig-17-title rdfig-17-desc" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<title id="rdfig-17-title">服务边界变了，配套机制也要跟着变</title>
<desc id="rdfig-17-desc">使用通用服务角色和示例编号说明具体机制，不包含内部资源标识。</desc>
<defs>
<marker id="rdfig-17-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#316650" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="rdfig-17-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#B65D3D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="1290" rx="22" fill="#F7F7F2"/>
<rect x="48" y="36" width="94" height="32" rx="8" fill="#233C35" stroke="none" stroke-width="1"/>
<text x="95" y="58" fill="#DCEBB1" font-size="17" font-weight="600" text-anchor="middle" >FIG. 01</text>
<text x="164" y="59" fill="#6D7D75" font-size="17" font-weight="500" text-anchor="start" letter-spacing="2">ENGINEERING / FIELD NOTES</text>
<text x="48" y="119" fill="#233C35" font-size="40" font-weight="650" text-anchor="start" >服务边界变了，配套机制也要跟着变</text>
<text x="50" y="159" fill="#6D7D75" font-size="23" font-weight="400" text-anchor="start" >生成链路的三个阶段：接入与执行 → 项目与调度 → 多入口复用。</text>
<rect x="48" y="214" width="1104" height="230" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="72" y="238" width="90" height="32" rx="8" fill="#E5EDE2" stroke="none" stroke-width="1"/>
<text x="117" y="260" fill="#316650" font-size="17" font-weight="600" text-anchor="middle" >起点</text>
<text x="190" y="263" fill="#233C35" font-size="27" font-weight="650" text-anchor="start" >先跑通产品和执行</text>
<rect x="270" y="297" width="280" height="82" rx="12" fill="#E5EDE2" stroke="none" stroke-width="1"/>
<rect x="810" y="297" width="292" height="82" rx="12" fill="#233C35" stroke="none" stroke-width="1"/>
<text x="410" y="349" fill="#233C35" font-size="30" font-weight="650" text-anchor="middle" >Gateway</text>
<text x="956" y="349" fill="#DCEBB1" font-size="30" font-weight="650" text-anchor="middle" >Runtime</text>
<path d="M 565 338 H 795" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-17-arrow)" />
<text x="680" y="318" fill="#316650" font-size="22" font-weight="500" text-anchor="middle" >Kitex RPC</text>
<text x="73" y="414" fill="#6D7D75" font-size="23" font-weight="400" text-anchor="start" >固定应用配对 · Gateway 配下游地址 · Runtime 已有任务状态与指标</text>
<rect x="48" y="483" width="1104" height="319" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="72" y="507" width="130" height="32" rx="8" fill="#E5EDE2" stroke="none" stroke-width="1"/>
<text x="137" y="529" fill="#316650" font-size="17" font-weight="600" text-anchor="middle" >拆出职责</text>
<text x="230" y="533" fill="#233C35" font-size="27" font-weight="650" text-anchor="start" >项目状态、调度和执行分别演进</text>
<rect x="72" y="578" width="230" height="104" rx="12" fill="#E5EDE2" stroke="none" stroke-width="1"/>
<text x="187" y="618" fill="#233C35" font-size="28" font-weight="650" text-anchor="middle" >Gateway</text>
<text x="187" y="655" fill="#316650" font-size="22" font-weight="400" text-anchor="middle" >客户端协议</text>
<rect x="430" y="578" width="280" height="104" rx="12" fill="#E5EDE2" stroke="none" stroke-width="1"/>
