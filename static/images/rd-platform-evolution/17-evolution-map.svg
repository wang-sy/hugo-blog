<text x="204" y="976" fill="#233C35" font-size="27" font-weight="600" text-anchor="middle" >领域 Gateway</text>
<rect x="72" y="1020" width="264" height="64" rx="12" fill="#E7EEF2" stroke="none" stroke-width="1"/>
<text x="204" y="1061" fill="#45677F" font-size="27" font-weight="600" text-anchor="middle" >移动端 WAP</text>
<path d="M 348 967 H 399 V 1008 H 519" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  />
<path d="M 348 1052 H 399 V 1008" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  />
<path d="M 519 1008 V 967 H 636" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-17-arrow)" />
<path d="M 519 1008 V 1052 H 636" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-17-arrow)" />
<text x="541" y="1016" fill="#316650" font-size="23" font-weight="600" text-anchor="start" >RPC</text>
<rect x="650" y="935" width="478" height="64" rx="12" fill="#E5EDE2" stroke="none" stroke-width="1"/>
<text x="889" y="976" fill="#233C35" font-size="27" font-weight="650" text-anchor="middle" >项目 · 版本 · 其他领域服务</text>
<rect x="650" y="1020" width="478" height="64" rx="12" fill="#233C35" stroke="none" stroke-width="1"/>
<text x="889" y="1061" fill="#DCEBB1" font-size="27" font-weight="650" text-anchor="middle" >调度与 Runtime 执行链</text>
<rect x="72" y="1114" width="1056" height="50" rx="10" fill="#F7F7F2" stroke="none" stroke-width="1"/>
<text x="600" y="1147" fill="#233C35" font-size="24" font-weight="500" text-anchor="middle" >配套：调用选路 · 分支环境 · 制品与目标 · 指标与日志</text>
<line x1="48" y1="1218" x2="1152" y2="1218" stroke="#D7DED5" stroke-width="2" />
<circle cx="58" cy="1252" r="5" fill="#316650" stroke="none" stroke-width="1"/>
<text x="76" y="1260" fill="#233C35" font-size="23" font-weight="500" text-anchor="start" >每拆开一种独立变化的职责，就要补齐跨服务的运行约定。</text>
</svg>
