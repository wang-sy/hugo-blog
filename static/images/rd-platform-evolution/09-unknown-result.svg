<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="rdfig-09-title rdfig-09-desc" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<title id="rdfig-09-title">请求超时，发布可能还在继续</title>
<desc id="rdfig-09-desc">使用通用服务角色和示例编号说明具体机制，不包含内部资源标识。</desc>
<defs>
<marker id="rdfig-09-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#316650" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="rdfig-09-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#B65D3D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="1000" rx="22" fill="#F7F7F2"/>
<rect x="48" y="36" width="94" height="32" rx="8" fill="#233C35" stroke="none" stroke-width="1"/>
<text x="95" y="58" fill="#DCEBB1" font-size="17" font-weight="600" text-anchor="middle" >FIG. 14</text>
<text x="164" y="59" fill="#6D7D75" font-size="17" font-weight="500" text-anchor="start" letter-spacing="2">ENGINEERING / FIELD NOTES</text>
<text x="48" y="119" fill="#233C35" font-size="40" font-weight="650" text-anchor="start" >请求超时，发布可能还在继续</text>
<text x="50" y="159" fill="#6D7D75" font-size="23" font-weight="400" text-anchor="start" >响应丢失以后，用同一个操作编号继续查询。</text>
<rect x="82" y="206" width="276" height="65" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="220" y="248" fill="#233C35" font-size="28" font-weight="650" text-anchor="middle" >客户端</text>
<line x1="220" y1="283" x2="220" y2="849" stroke="#D7DED5" stroke-width="2" stroke-dasharray="5 8"/>
<rect x="462" y="206" width="276" height="65" rx="12" fill="#233C35" stroke="none" stroke-width="1"/>
<text x="600" y="248" fill="#DCEBB1" font-size="28" font-weight="650" text-anchor="middle" >发布平台</text>
<line x1="600" y1="283" x2="600" y2="849" stroke="#D7DED5" stroke-width="2" stroke-dasharray="5 8"/>
<rect x="842" y="206" width="276" height="65" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="980" y="248" fill="#233C35" font-size="28" font-weight="650" text-anchor="middle" >持久化执行</text>
<line x1="980" y1="283" x2="980" y2="849" stroke="#D7DED5" stroke-width="2" stroke-dasharray="5 8"/>
<rect x="589" y="307" width="22" height="496" rx="8" fill="#E5EDE2" stroke="none" stroke-width="1"/>
<path d="M 220 328 H 585" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-09-arrow)" />
<text x="399" y="312" fill="#233C35" font-size="24" font-weight="550" text-anchor="middle" >提交发布 · A</text>
<path d="M 614 397 H 966" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-09-arrow)" />
<text x="790" y="380" fill="#233C35" font-size="23" font-weight="550" text-anchor="middle" >先保存 A，再开始执行</text>
<path d="M 586 471 H 235" fill="none" stroke="#B65D3D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-09-warm)" stroke-dasharray="7 7"/>
<rect x="343" y="450" width="118" height="38" rx="5" fill="#F7F7F2" stroke="none" stroke-width="1"/>
<text x="402" y="477" fill="#B65D3D" font-size="24" font-weight="600" text-anchor="middle" >响应丢失</text>
<rect x="66" y="514" width="308" height="94" rx="14" fill="#F5E5D9" stroke="none" stroke-width="1"/>
<text x="220" y="551" fill="#B65D3D" font-size="25" font-weight="650" text-anchor="middle" >客户端：结果未知</text>
<text x="220" y="587" fill="#233C35" font-size="22" font-weight="400" text-anchor="middle" >超时不改变操作身份</text>
<rect x="861" y="443" width="238" height="242" rx="16" fill="#233C35" stroke="none" stroke-width="1"/>
<rect x="885" y="465" width="104" height="32" rx="8" fill="#DCEBB1" stroke="none" stroke-width="1"/>
<text x="937" y="487" fill="#233C35" font-size="17" font-weight="600" text-anchor="middle" >操作 A</text>
<text x="884" y="536" fill="#FFFFFF" font-size="25" font-weight="500" text-anchor="start" >仍在执行</text>
<text x="884" y="584" fill="#FFFFFF" font-size="25" font-weight="500" text-anchor="start" >持续保存进度</text>
<text x="884" y="632" fill="#FFFFFF" font-size="25" font-weight="500" text-anchor="start" >最终记录结果</text>
<path d="M 220 658 H 585" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-09-arrow)" />
<text x="400" y="641" fill="#233C35" font-size="24" font-weight="550" text-anchor="middle" >按操作 A 重新查询</text>
<path d="M 966 727 H 616" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-09-arrow)" />
<text x="790" y="710" fill="#233C35" font-size="23" font-weight="550" text-anchor="middle" >更新 A 的执行状态</text>
<path d="M 585 804 H 234" fill="none" stroke="#316650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdfig-09-arrow)" />
<text x="407" y="785" fill="#233C35" font-size="24" font-weight="550" text-anchor="middle" >返回 A 的当前状态</text>
<rect x="70" y="854" width="263" height="32" rx="8" fill="#DCEBB1" stroke="none" stroke-width="1"/>
<text x="201.5" y="876" fill="#233C35" font-size="17" font-weight="600" text-anchor="middle" >始终追踪同一个 A</text>
<text x="359" y="878" fill="#233C35" font-size="25" font-weight="500" text-anchor="start" >状态可以变化，操作身份保持不变。</text>
<line x1="48" y1="928" x2="1152" y2="928" stroke="#D7DED5" stroke-width="2" />
<circle cx="58" cy="962" r="5" fill="#316650" stroke="none" stroke-width="1"/>
<text x="76" y="970" fill="#233C35" font-size="23" font-weight="500" text-anchor="start" >客户端不知道结果时，先恢复对原操作的观察。</text>
</svg>
