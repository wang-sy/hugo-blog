<text x="135.0" y="382.52000000000004" text-anchor="middle" font-size="22" font-weight="400" fill="#000">平台服务</text>
<text x="135.0" y="412.44000000000005" text-anchor="middle" font-size="22" font-weight="400" fill="#000">任务 / 调度</text>
</g>
<rect x="480" y="305" width="270" height="173" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
<text x="615.0" y="335" text-anchor="middle" font-size="22" font-weight="600" fill="#000">Sandbox</text>
