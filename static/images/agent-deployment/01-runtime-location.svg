<text x="170.0" y="164.98" text-anchor="middle" font-size="22" font-weight="400" fill="#000">Agent Loop</text>
</g>
<rect x="480" y="65" width="270" height="175" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
<text x="615.0" y="95" text-anchor="middle" font-size="22" font-weight="600" fill="#000">Sandbox</text>
