<rect x="25" y="65" width="290" height="175" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
<text x="170.0" y="95" text-anchor="middle" font-size="22" font-weight="600" fill="#000">Runtime</text>
<g data-node="55,130,230,55">
