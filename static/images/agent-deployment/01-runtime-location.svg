<text x="905.0" y="143.01999999999998" text-anchor="middle" font-size="22" font-weight="400" fill="#000">Model</text>
<text x="905.0" y="172.94" text-anchor="middle" font-size="22" font-weight="400" fill="#000">API</text>
</g>
<path d="M170 65 V42 H905 V101" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="790" y="30" text-anchor="middle" font-size="18" font-weight="400" fill="#000">模型调用</text>
