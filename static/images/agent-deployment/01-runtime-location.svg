<text x="398" y="105" text-anchor="middle" font-size="18" font-weight="400" fill="#000">工具调用</text>
<path d="M468 199 L328 199" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="398" y="224" text-anchor="middle" font-size="18" font-weight="400" fill="#000">执行结果</text>
<text x="25" y="289" text-anchor="start" font-size="22" font-weight="600" fill="#000">Sandbox 内 Codex</text>
