<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img">
<title>目录持久化的覆盖范围</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
<rect width="1000" height="580" fill="white"/>
<g font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" fill="#111" font-size="22">
<rect x="35" y="50" width="400" height="445" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
<text x="235" y="91" font-size="22" text-anchor="middle" font-weight="600">任一次 Sandbox 实例</text>
<rect x="65" y="125" width="340" height="135" fill="#f8cecc" stroke="#111" stroke-width="1.6"/>
<text x="235" y="161" font-size="22" text-anchor="middle" font-weight="600">挂载范围之外</text>
<text x="235" y="202" font-size="21" text-anchor="middle">/usr · /etc · 系统库</text>
<text x="235" y="238" font-size="20" text-anchor="middle">以及系统包数据库</text>
<rect x="65" y="316" width="340" height="133" fill="#b0e3e6" stroke="#111" stroke-width="1.6"/>
<text x="235" y="351" font-size="22" text-anchor="middle" font-weight="600">预先确定的挂载目录</text>
<text x="235" y="391" font-size="21" text-anchor="middle">/workspace</text>
<text x="235" y="427" font-size="21" text-anchor="middle">/home/user/tools</text>
<rect x="570" y="50" width="395" height="445" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
<text x="767" y="91" font-size="22" text-anchor="middle" font-weight="600">独立持久存储</text>
<rect x="610" y="214" width="315" height="181" fill="#d5e8d4" stroke="#111" stroke-width="1.6"/>
<text x="767" y="255" font-size="22" text-anchor="middle" font-weight="600">项目目录 W</text>
<text x="767" y="303" font-size="21" text-anchor="middle">源码与项目文件</text>
<text x="767" y="346" font-size="20" text-anchor="middle">明确安装在此的用户工具</text>
<text x="767" y="377" font-size="18" text-anchor="middle">卷标识、路径、权限需匹配</text>
<path d="M 405 364 H 610" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="505" y="345" font-size="20" text-anchor="middle">挂载</text>
<text x="767" y="451" font-size="20" text-anchor="middle">新实例继续挂载同一份目录</text>
<text x="500" y="548" font-size="21" text-anchor="middle">安装位置落在挂载范围内，目录持久化才覆盖得到</text>
</g></svg>
