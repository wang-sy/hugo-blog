<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Reader 的单写入者与执行代次</title>
  <desc id="desc">正常执行时旧 reader 以 epoch 7 持有目标连接锁。旧连接释放后新 reader 获得同一把锁并采用 epoch 8。旧 reader 恢复连接时，持久化代次校验拒绝 epoch 7。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker></defs>
  <style>text{font-family:Arial,Helvetica,"PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;fill:#222}.small{font-size:19px}.head{font-weight:600}.box{fill:#fff;stroke:#222;stroke-width:1.6}.line{fill:none;stroke:#222;stroke-width:1.6;marker-end:url(#arrow)}</style>
  <rect width="1000" height="460" fill="#fff"/>
  <text class="head" x="175" y="46" text-anchor="middle">旧连接仍然存在</text>
  <text class="head" x="505" y="46" text-anchor="middle">旧连接释放后</text>
  <text class="head" x="835" y="46" text-anchor="middle">旧进程尝试重连</text>
  <path d="M340 24V411M670 24V411" stroke="#999" stroke-width="1.2" stroke-dasharray="5 5"/>
  <rect class="box" x="50" y="82" width="250" height="72"/>
  <text x="175" y="126" text-anchor="middle">旧 Reader · epoch 7</text>
  <path class="line" d="M175 154V246"/>
  <text class="small" x="194" y="206">持有锁</text>
  <rect class="box" x="50" y="246" width="250" height="84"/>
  <text x="175" y="279" text-anchor="middle">目标连接锁</text>
  <text class="small" x="175" y="310" text-anchor="middle">持久 epoch = 7</text>
  <text class="small" x="175" y="374" text-anchor="middle">新 Reader 等待旧 writer 退出</text>
  <rect x="380" y="82" width="250" height="72" fill="#b0e3e6" stroke="#0e8088" stroke-width="1.6"/>
  <text x="505" y="126" text-anchor="middle">新 Reader · epoch 8</text>
  <path class="line" d="M505 154V246"/>
  <text class="small" x="524" y="206">接管</text>
  <rect x="380" y="246" width="250" height="84" fill="#d5e8d4" stroke="#82b366" stroke-width="1.6"/>
  <text x="505" y="279" text-anchor="middle">同一 Reader 的目标锁</text>
  <text class="small" x="505" y="310" text-anchor="middle">持久 epoch = 8</text>
  <text class="small" x="505" y="374" text-anchor="middle">取得互斥后采用新的执行代次</text>
  <rect class="box" x="710" y="82" width="250" height="72"/>
  <text x="835" y="126" text-anchor="middle">旧 Reader · epoch 7</text>
  <path class="line" d="M835 154V246"/>
  <text class="small" x="854" y="206">重连校验</text>
  <rect x="710" y="246" width="250" height="84" fill="#f8cecc" stroke="#b85450" stroke-width="1.6"/>
  <text x="835" y="279" text-anchor="middle">7 &lt; 8，拒绝写入</text>
  <text class="small" x="835" y="310" text-anchor="middle">断点提交也校验 epoch</text>
  <text class="small" x="835" y="374" text-anchor="middle">即使新连接已退出，旧代仍失效</text>
  <text class="small" x="500" y="435" text-anchor="middle">这里的“锁”按 Reader 身份区分；控制租约、连接互斥和持久代次共同约束执行权</text>
</svg>
