<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="670" viewBox="0 0 1150 670" role="img" aria-labelledby="overview-title"><title id="overview-title">我们需要重新审视的几个假设</title><defs><marker id="decision-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8a9baa"/></marker></defs><rect width="1150" height="670" fill="#fffefa"/><g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif"><text x="180" y="38" text-anchor="middle" font-size="21" font-weight="650" fill="#705050">需要检验的假设</text><text x="530" y="38" text-anchor="middle" font-size="21" font-weight="650" fill="#715020">可能引入的代价</text><text x="925" y="38" text-anchor="middle" font-size="21" font-weight="650" fill="#214e42">现在的判断</text><g><rect x="30" y="65" width="300" height="116" rx="12" fill="#f5eeee" stroke="#bb9998"/><text x="180" y="114" text-anchor="middle" font-size="20" font-weight="450" fill="#705050">工作变复杂</text><text x="180" y="144" text-anchor="middle" font-size="20" font-weight="450" fill="#705050">就拆更多 Agent</text></g><path d="M338 123 L369 123" stroke="#8a9baa" stroke-width="1.6" fill="none" marker-end="url(#decision-arrow)"/><g><rect x="380" y="65" width="300" height="116" rx="12" fill="#fff2df" stroke="#c49a58"/><text x="530" y="114" text-anchor="middle" font-size="20" font-weight="450" fill="#715020">一次任务多次交接</text><text x="530" y="144" text-anchor="middle" font-size="20" font-weight="450" fill="#715020">工程上下文被反复转述</text></g><path d="M688 123 L719 123" stroke="#8a9baa" stroke-width="1.6" fill="none" marker-end="url(#decision-arrow)"/><g><rect x="730" y="65" width="390" height="116" rx="12" fill="#e8f5f0" stroke="#5d9181"/><text x="925" y="114" text-anchor="middle" font-size="20" font-weight="600" fill="#214e42">先判断工作能否独立</text><text x="925" y="144" text-anchor="middle" font-size="20" font-weight="600" fill="#214e42">再决定是否需要另一个 Agent</text></g><g><rect x="30" y="208" width="300" height="116" rx="12" fill="#f5eeee" stroke="#bb9998"/><text x="180" y="257" text-anchor="middle" font-size="20" font-weight="450" fill="#705050">多加流程和检查</text><text x="180" y="287" text-anchor="middle" font-size="20" font-weight="450" fill="#705050">结果就会更稳定</text></g><path d="M338 266 L369 266" stroke="#8a9baa" stroke-width="1.6" fill="none" marker-end="url(#decision-arrow)"/><g><rect x="380" y="208" width="300" height="116" rx="12" fill="#fff2df" stroke="#c49a58"/><text x="530" y="257" text-anchor="middle" font-size="20" font-weight="450" fill="#715020">固定循环消耗预算</text><text x="530" y="287" text-anchor="middle" font-size="20" font-weight="450" fill="#715020">检查目标可能偏离用户要求</text></g><path d="M688 266 L719 266" stroke="#8a9baa" stroke-width="1.6" fill="none" marker-end="url(#decision-arrow)"/><g><rect x="730" y="208" width="390" height="116" rx="12" fill="#e8f5f0" stroke="#5d9181"/><text x="925" y="257" text-anchor="middle" font-size="20" font-weight="600" fill="#214e42">用真实证据辅助判断</text><text x="925" y="287" text-anchor="middle" font-size="20" font-weight="600" fill="#214e42">保留目标和必要约束</text></g><g><rect x="30" y="351" width="300" height="116" rx="12" fill="#f5eeee" stroke="#bb9998"/><text x="180" y="400" text-anchor="middle" font-size="20" font-weight="450" fill="#705050">换成更强的模型</text><text x="180" y="430" text-anchor="middle" font-size="20" font-weight="450" fill="#705050">自然就有更强的 Agent</text></g><path d="M338 409 L369 409" stroke="#8a9baa" stroke-width="1.6" fill="none" marker-end="url(#decision-arrow)"/><g><rect x="380" y="351" width="300" height="116" rx="12" fill="#fff2df" stroke="#c49a58"/><text x="530" y="400" text-anchor="middle" font-size="20" font-weight="450" fill="#715020">工具和上下文没有跟上</text><text x="530" y="430" text-anchor="middle" font-size="20" font-weight="450" fill="#715020">新能力未必能发挥出来</text></g><path d="M688 409 L719 409" stroke="#8a9baa" stroke-width="1.6" fill="none" marker-end="url(#decision-arrow)"/><g><rect x="730" y="351" width="390" height="116" rx="12" fill="#e8f5f0" stroke="#5d9181"/><text x="925" y="400" text-anchor="middle" font-size="20" font-weight="600" fill="#214e42">连同工具与环境一起适配</text><text x="925" y="430" text-anchor="middle" font-size="20" font-weight="600" fill="#214e42">用同类任务重新比较</text></g><g><rect x="30" y="494" width="300" height="116" rx="12" fill="#f5eeee" stroke="#bb9998"/><text x="180" y="543" text-anchor="middle" font-size="20" font-weight="450" fill="#705050">模型能做更多</text><text x="180" y="573" text-anchor="middle" font-size="20" font-weight="450" fill="#705050">系统就能少管一些</text></g><path d="M338 552 L369 552" stroke="#8a9baa" stroke-width="1.6" fill="none" marker-end="url(#decision-arrow)"/><g><rect x="380" y="494" width="300" height="116" rx="12" fill="#fff2df" stroke="#c49a58"/><text x="530" y="543" text-anchor="middle" font-size="20" font-weight="450" fill="#715020">任务和费用仍会失败</text><text x="530" y="573" text-anchor="middle" font-size="20" font-weight="450" fill="#715020">完成的结果仍可能送不到</text></g><path d="M688 552 L719 552" stroke="#8a9baa" stroke-width="1.6" fill="none" marker-end="url(#decision-arrow)"/><g><rect x="730" y="494" width="390" height="116" rx="12" fill="#e8f5f0" stroke="#5d9181"/><text x="925" y="543" text-anchor="middle" font-size="20" font-weight="600" fill="#214e42">系统守住业务事实</text><text x="925" y="573" text-anchor="middle" font-size="20" font-weight="600" fill="#214e42">持续评估可交给模型的工作</text></g><text x="30" y="651" font-size="15" fill="#7b858f">围绕当前模型、当前任务验证这些假设，决定哪些设计继续保留。</text></g></svg>